name: Arcade checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify invariants, reference and playable combat, replay and static bundle
        run: npm run verify
      - name: Verify staged bundle has no runtime packages
        run: |
          test -f _site/index.html
          test -f _site/src/game/app.mjs
          test -f _site/style.css
          test ! -e _site/node_modules

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Keep this image version aligned with package-lock.json. Browsers and their
    # OS libraries are baked in, avoiding slow per-run Ubuntu package downloads.
    container:
      image: mcr.microsoft.com/playwright:v1.51.1-noble@sha256:146d046a8d79a1b3a87596c4457b0b1c47f811bf4fc2cc1b99e873ae7f1cbbbd
      # Match the hosted runner's workspace/home owner; Firefox rejects root
      # running in a home directory owned by the unprivileged runner user.
      options: --user 1001 --init --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install test-only dependencies
        run: npm ci --ignore-scripts
      - name: Build and test actual static application
        timeout-minutes: 5
        run: npm run build && npm run browser
      - name: Retain browser screenshots, replay and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lbl-browser-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, browser]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage verified static site
        run: npm run verify
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

